name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build WinTab Launcher and Keyboard
        run: gradle :app:assembleDebug :keyboard:assembleDebug

      - name: Upload WinTab Launcher v3
        uses: actions/upload-artifact@v4
        with:
          name: WinTabLauncher-v3-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload WinTab Keyboard
        uses: actions/upload-artifact@v4
        with:
          name: WinTabKeyboard-APK
          path: keyboard/build/outputs/apk/debug/keyboard-debug.apk
