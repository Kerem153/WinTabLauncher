plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pattiz.wintablauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.pattiz.wintablauncher"
        minSdk 21
        targetSdk 28
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
